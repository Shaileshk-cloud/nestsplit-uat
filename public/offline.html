<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#244c39" />
  <title>NestSplit — Offline</title>
  <style>
    :root {
      --green: #244c39;
      --mint: #c5f9a9;
      --ink: #17201b;
      --muted: #718076;
      --paper: #fffdf9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, Arial, sans-serif;
      background: #e9eee8;
      color: var(--ink);
    }
    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .shell {
      width: 100%;
      max-width: 430px;
      background: var(--paper);
      border-radius: 28px;
      padding: 52px 32px 48px;
      box-shadow: 0 24px 80px rgba(51,67,54,0.17);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }
    .logo {
      height: 64px;
      width: 64px;
      border-radius: 20px;
      background: var(--green);
      color: var(--mint);
      font-size: 34px;
      font-weight: 900;
      display: grid;
      place-items: center;
    }
    h1 {
      font-size: 26px;
      letter-spacing: -0.8px;
      color: var(--ink);
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 280px;
    }
    .retry {
      margin-top: 8px;
      padding: 14px 28px;
      border: none;
      border-radius: 14px;
      background: var(--green);
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    @media (max-width: 460px) {
      .stage { padding: 0; }
      .shell {
        min-height: 100vh;
        border-radius: 0;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="shell">
      <div class="logo">N</div>
      <h1>You&rsquo;re offline</h1>
      <p>
        Connect to the internet to access your latest financial data.
        NestSplit needs a live connection to load your transactions securely.
      </p>
      <button class="retry" onclick="window.location.reload()">Try again</button>
    </div>
  </div>
</body>
</html>
